# Helyi fejlesztés: a kód élőben csatolva, külön adatkötettel (a Pi-n futó éles adatokat nem érinti).
# Indítás: docker compose -f docker-compose.dev.yml up --build
services:
  cukornaplo:
    build: .
    container_name: cukornaplo-dev
    environment:
      - TZ=Europe/Budapest
      # Fejlesztés közben ne kérdezze le a CareLinket a háttérben.
      - CARELINK_INTERVAL=86400
    volumes:
      - .:/var/www/html
      # Névvel ellátott kötet: az SQLite WAL mód Windowsról csatolt mappán nem megbízható.
      - cukornaplo-dev-data:/data
    ports:
      - "5478:80"

volumes:
  cukornaplo-dev-data:
