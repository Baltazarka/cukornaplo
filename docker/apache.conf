ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# A Docker-fájlokhoz és a dokumentációhoz böngészőből nincs hozzáférés.
<DirectoryMatch "^/var/www/html/(docker|data)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(Dockerfile|docker-compose\.yml|\.env.*|README\.md|\.dockerignore)$">
    Require all denied
</FilesMatch>
