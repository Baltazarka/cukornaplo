# A natív iOS riasztó app fordítása aláíratlan .ipa-vá (macOS futtatón). Az .ipa-t te írod alá
# (AltStore / Sideloadly) a saját Apple-azonosítóddal, és telepíted a telefonra.
name: iOS riasztó app

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-alarm.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen telepítése és a projekt generálása
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Fordítás (aláírás nélkül)
        working-directory: ios
        run: |
          xcodebuild \
            -project CukornaploAlarm.xcodeproj \
            -scheme CukornaploAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: .ipa csomagolása
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CukornaploAlarm.app Payload/
          zip -qr CukornaploAlarm.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CukornaploAlarm-ipa
          path: ios/CukornaploAlarm.ipa
